name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a one-line script
        run: echo Hello, world!
      - name: Show environment info
        env:
          MY_NAME: Hari
        run: echo "Hello $MY_NAME from $GITHUB_REPOSITORY on $RUNNER_OS"
      - name: Show event type
        run: echo "Triggered by $GITHUB_EVENT_NAME"
      - name: Use the secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Secret value is: $MY_SECRET"
          echo "Secret length is: ${#MY_SECRET}"

name: Greet
description: Print a greeting

inputs:
  who:
    description: Name to greet
    required: false
    default: World

runs:
  using: composite
  steps:
    - name: Say hello
      shell: bash
      run: echo "Hello, ${{ inputs.who }}!"
    - name: Show runner OS
      shell: bash
      run: echo "Running on $RUNNER_OS"
